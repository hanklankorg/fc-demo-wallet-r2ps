name: Pull Request Workflow
# Forge CI owns the lint and security gate: the checks of nanolinter.toml,
# which fail the pull request on a finding. The workspace tests run in the
# test job below.
on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
      - "feature/**"
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-checks:
    uses: hanklankorg/fc-forge-ci/.github/workflows/pullrequest-orchestrator.yml@d33ea2bd2260bad172b2af3a79d2a2f066dfc293 # v0.90.0
    secrets:
      # Optional: uploads lint security findings (SARIF) to Code Scanning.
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    permissions:
      actions: read # Download workflow result artifacts
      contents: read # Clone repository and read source code
    with:
      # The full commit the uses: ref above names; every job of the route runs
      # the CLI built in this run from exactly this commit.
      forge-ci-binary-ref: d33ea2bd2260bad172b2af3a79d2a2f066dfc293
      # Pinned by digest and admitted before any job runs; replace FIXME with
      # the digests of the release you call (docs/runtime-images.md).
      runtime-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-base@sha256:9864c261c1b2f71d46eac2520f2e66de6b1ceb03c50f8d91acd19ddbccdd53e8 # FIXME v0.90.0 digest
      canonical-builder-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-go-1.27@sha256:d617197ad72db4c7a40e8d9727bcef523218b13b1f59c85b046aa5d9bb60d2e5 # FIXME v0.90.0 digest
      project-type: cargo
      # The lint image, pinned by digest: the plan job refuses a tag.
      nanolinter-image: ghcr.io/hanklankorg/nanolinter-rust@sha256:adf38a0305a9c58b3bfba49284e63c9e0cc062f36755f44037a1291a79f40b03
      lint-engine: nanolinter
      # Lint findings fail the pull request, as the lint job did before.
      # Dependency advisories are reported and do not fail it: the scan
      # covers every dependency, not only the ones a pull request changes.
      enforce-lint: true
      enforce-vulnerabilities: false
  # Clippy, the dependency audit and the workspace tests. The orchestrator
  # never runs them; require these jobs and pr-checks as status checks.
  test:
    permissions:
      contents: read # Access test resources and source code
      packages: read # Fetch dependencies from GitHub Packages
    uses: ./.github/workflows/test.yml
