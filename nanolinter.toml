# The lint plan of the pull request gate: Forge CI runs `nanolinter verify`
# against it. The checks are the ones `just lint-all` runs, with the SAST
# and dependency scans the pull request gate ran before.
# Clippy is not here: it compiles the workspace, which needs the native
# build dependencies (OpenSSL, cmake for librdkafka) the lint image lacks.
# It runs in .github/workflows/test.yml.
# `nanolinter explain --all` lists more checks.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "container",
  "toml",
  "rust-format",
]

# SAST findings are reported and do not fail the pull request: "sast" runs
# under [verify] and is not listed here.
[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "container",
  "toml",
  "rust-format",
]
